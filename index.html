<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Loan Payment Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Auto Loan Payment Calculator</h1>

        <div class="calculator-container">
            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="payment-calc">Calculate Payment</button>
                <button type="button" class="tab-btn" data-tab="amount-calc">Calculate Loan Amount</button>
            </div>

            <div class="tab-content">
                <!-- Calculate Payment Tab -->
                <div class="tab-pane active" id="payment-calc">
                    <h2>Calculate Monthly Payment</h2>
                    <form id="payment-form">
                        <div class="form-group">
                            <label for="loan-amount">Loan Amount ($):</label>
                            <input type="number" id="loan-amount" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="loan-term">Loan Term (months):</label>
                            <input type="number" id="loan-term" min="1" max="120" required>
                        </div>
                        <div class="form-group">
                            <label for="interest-rate">Interest Rate (% APR):</label>
                            <input type="number" id="interest-rate" min="0" step="0.01" required>
                        </div>
                        <button type="submit" class="calculate-btn">Calculate</button>
                    </form>
                    <div class="result" id="payment-result">
                        <h3>Monthly Payment:</h3>
                        <p class="amount">$0.00</p>
                    </div>
                </div>

                <!-- Calculate Loan Amount Tab -->
                <div class="tab-pane" id="amount-calc">
                    <h2>Calculate Loan Amount</h2>
                    <form id="amount-form">
                        <div class="form-group">
                            <label for="desired-payment">Desired Monthly Payment ($):</label>
                            <input type="number" id="desired-payment" min="1" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="amount-term">Loan Term (months):</label>
                            <input type="number" id="amount-term" min="1" max="120" required>
                        </div>
                        <div class="form-group">
                            <label for="amount-rate">Interest Rate (% APR):</label>
                            <input type="number" id="amount-rate" min="0" step="0.01" required>
                        </div>
                        <button type="submit" class="calculate-btn">Calculate</button>
                    </form>
                    <div class="result" id="amount-result">
                        <h3>Loan Amount:</h3>
                        <p class="amount">$0.00</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
