<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive viewport settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <!-- Browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO meta tags -->
    <meta name="description" content="Calculate auto loan payments, loan amounts, and monthly income with Stingcalc - a free calculator tool from Stingray Chevrolet">
    <meta name="keywords" content="auto loan, car loan, payment calculator, loan calculator, income calculator">
    <meta name="author" content="Stingray Chevrolet">

    <!-- Page title -->
    <title>Stingray Chevrolet Finance Calculator</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">

    <!-- Preload critical assets -->
    <link rel="preload" href="styles.css" as="style">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">

    <!-- Mobile theme color -->
    <meta name="theme-color" content="#4285f4">

    <!-- No-JS fallback message -->
    <noscript>
        <style>
            .calculator-container { display: none; }
            .noscript-message { display: block; text-align: center; margin: 2rem; }
        </style>
    </noscript>
</head>
<body>
    <!-- No-JS message -->
    <noscript>
        <div class="noscript-message">
            <h2>JavaScript Required</h2>
            <p>This calculator requires JavaScript to function. Please enable JavaScript in your browser settings and reload the page.</p>
        </div>
    </noscript>

    <div class="container">
        <h1>Stingray Chevrolet Finance Calculator</h1>

        <div class="calculator-container">
            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="payment-calc">Calculate Payment</button>
                <button type="button" class="tab-btn" data-tab="amount-calc">Calculate Loan Amount</button>
                <button type="button" class="tab-btn" data-tab="income-calc">Calculate Monthly Income</button>
            </div>

            <div class="tab-content">
                <!-- Calculate Payment Tab -->
                <div class="tab-pane active" id="payment-calc">
                    <h2>Calculate Monthly Payment</h2>
                    <form id="payment-form">
                        <div class="form-group">
                            <label for="loan-amount">Loan Amount ($):</label>
                            <input type="number" id="loan-amount" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="loan-term">Loan Term (months):</label>
                            <input type="number" id="loan-term" min="1" max="120" required>
                        </div>
                        <div class="form-group">
                            <label for="interest-rate">Interest Rate (% APR):</label>
                            <input type="number" id="interest-rate" min="0" step="0.01" required>
                        </div>
                        <div class="button-group">
                            <button type="submit" class="calculate-btn">Calculate</button>
                            <button type="button" class="clear-btn" data-form="payment-form">Clear</button>
                        </div>
                    </form>
                    <div class="result" id="payment-result">
                        <h3>Monthly Payment:</h3>
                        <p class="amount">$0.00</p>
                    </div>
                </div>

                <!-- Calculate Loan Amount Tab -->
                <div class="tab-pane" id="amount-calc">
                    <h2>Calculate Loan Amount</h2>
                    <form id="amount-form">
                        <div class="form-group">
                            <label for="desired-payment">Desired Monthly Payment ($):</label>
                            <input type="number" id="desired-payment" min="1" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="amount-term">Loan Term (months):</label>
                            <input type="number" id="amount-term" min="1" max="120" required>
                        </div>
                        <div class="form-group">
                            <label for="amount-rate">Interest Rate (% APR):</label>
                            <input type="number" id="amount-rate" min="0" step="0.01" required>
                        </div>
                        <div class="button-group">
                            <button type="submit" class="calculate-btn">Calculate</button>
                            <button type="button" class="clear-btn" data-form="amount-form">Clear</button>
                        </div>
                    </form>
                    <div class="result" id="amount-result">
                        <h3>Loan Amount:</h3>
                        <p class="amount">$0.00</p>
                    </div>
                </div>

                <!-- Calculate Monthly Income Tab -->
                <div class="tab-pane" id="income-calc">
                    <h2>Calculate Monthly Income</h2>
                    <form id="income-form">
                        <div class="form-group">
                            <label for="ytd-amount">Year-to-Date (YTD) Amount ($):</label>
                            <input type="number" id="ytd-amount" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="check-date">Check Date:</label>
                            <input type="date" id="check-date" required>
                        </div>
                        <div class="form-group">
                            <label for="hire-date">Hire Date (if hired this year):</label>
                            <input type="date" id="hire-date">
                            <small class="form-text">Leave blank if hired before this year</small>
                        </div>
                        <div class="button-group">
                            <button type="submit" class="calculate-btn">Calculate</button>
                            <button type="button" class="clear-btn" data-form="income-form">Clear</button>
                        </div>
                    </form>
                    <div class="result" id="income-result">
                        <h3>Estimated Monthly Gross Income:</h3>
                        <p class="amount">$0.00</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
