<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Pencil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Quick Pencil</h1>
    </header>
    <main>
        <form id="calculator-form">
            <fieldset>
                <legend>Vehicle &amp; Pricing</legend>
                <div>
                    <label>Sale Type:</label>
                    <input type="radio" id="sale-type-new" name="sale_type" value="new" checked>
                    <label for="sale-type-new">New</label>
                    <input type="radio" id="sale-type-used" name="sale_type" value="used">
                    <label for="sale-type-used">Used</label>
                </div>
                <div>
                    <label for="msrp">M.S.R.P.:</label>
                    <input type="number" id="msrp" name="msrp" required>
                </div>
                <div>
                    <label for="selling-price">Selling Price:</label>
                    <input type="number" id="selling-price" name="selling_price" required>
                </div>
                <div>
                    <label for="additional-equipment">Additional Equipment:</label>
                    <input type="number" id="additional-equipment" name="additional_equipment">
                </div>
                <div>
                    <label for="discount">Discount:</label>
                    <input type="number" id="discount" name="discount">
                </div>
                <div>
                    <label for="rebates">Rebates:</label>
                    <input type="number" id="rebates" name="rebates">
                </div>
            </fieldset>

            <fieldset>
                <legend>Trade-In</legend>
                <div>
                    <label for="trade-allowance">Trade Allowance:</label>
                    <input type="number" id="trade-allowance" name="trade_allowance">
                </div>
                <div>
                    <label for="trade-payoff">Trade Payoff:</label>
                    <input type="number" id="trade-payoff" name="trade_payoff">
                </div>
            </fieldset>

            <fieldset>
                <legend>Finalizing the Deal</legend>
                <div>
                    <label>Tag Type:</label>
                    <input type="radio" id="tag-type-new" name="tag_type" value="new" checked>
                    <label for="tag-type-new">New Tag</label>
                    <input type="radio" id="tag-type-transfer" name="tag_type" value="transfer">
                    <label for="tag-type-transfer">Transfer Tag</label>
                </div>
                <div>
                    <label for="down-payment">Down Payment:</label>
                    <input type="number" id="down-payment" name="down_payment">
                </div>
            </fieldset>
            <button type="submit">Calculate</button>
        </form>

        <section id="summary-section">
            <h2>Calculation Summary</h2>
            <div id="itemized-summary">
                <!-- Calculation details will be populated here by script.js -->
            </div>
            <div id="final-amount">
                <h3>Amount to be Financed:</h3>
                <p id="amount-to-finance-display">$0.00</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
