<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Rate Solver Test</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 3px; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        input, button { margin: 5px; padding: 8px; }
        .test-controls { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Interest Rate Solver Test Suite</h1>

    <div class="test-section">
        <h2>Manual Testing Interface</h2>
        <div class="info">Test the Interest Rate Solver functionality manually:</div>
        <div class="test-controls">
            <label>Principal Amount ($): <input type="number" id="test-principal" value="25000" step="0.01"></label><br>
            <label>Loan Term (months): <input type="number" id="test-term" value="60" min="1" max="120"></label><br>
            <label>Target Payment ($): <input type="number" id="test-payment" value="450" step="0.01"></label><br>
            <button onclick="runManualTest()">Calculate Rate</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>
        <div id="manual-result" class="test-result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h2>Automated Test Cases</h2>
        <button onclick="runAutomatedTests()">Run All Automated Tests</button>
        <div id="automated-results"></div>
    </div>

    <div class="test-section">
        <h2>Edge Case Testing</h2>
        <button onclick="runEdgeCaseTests()">Test Edge Cases</button>
        <div id="edge-case-results"></div>
    </div>

    <div class="test-section">
        <h2>Input Validation Testing</h2>
        <button onclick="runValidationTests()">Test Input Validation</button>
        <div id="validation-results"></div>
    </div>

    <script src="script.js"></script>
    <script>
        // Test results tracking
        let testResults = {
            passed: 0,
            failed: 0,
            total: 0
        };

        function runManualTest() {
            const principal = parseFloat(document.getElementById('test-principal').value);
            const termInMonths = parseInt(document.getElementById('test-term').value);
            const payment = parseFloat(document.getElementById('test-payment').value);

            // Use the actual form validation from script.js
            if (isNaN(principal) || isNaN(termInMonths) || isNaN(payment) ||
                principal <= 0 || termInMonths <= 0 || payment <= 0) {
                showTestResult('manual-result', 'fail', 'Invalid input values provided');
                return;
            }

            // Check minimum payment requirement
            const minPayment = principal / termInMonths;
            if (payment < minPayment) {
                const rate = 'N/A';
                const message = `Payment too low to amortize loan. Minimum required payment: $${minPayment.toFixed(2)}`;
                showTestResult('manual-result', 'fail', `${message}<br>Calculated Rate: ${rate}`);
                return;
            }

            // Calculate using the actual function from script.js
            const calculatedRate = calculateInterestRate(principal, termInMonths, payment);

            if (calculatedRate === null) {
                showTestResult('manual-result', 'fail', 'Unable to calculate rate. Payment may be too high or loan terms invalid.');
            } else {
                // Verify the calculation by calculating the payment back
                const verifiedPayment = calculateMonthlyPayment(principal, termInMonths, calculatedRate * 100);
                const difference = Math.abs(verifiedPayment - payment);

                if (difference < 0.01) {
                    showTestResult('manual-result', 'pass',
                        `✓ Rate: ${calculatedRate.toFixed(2)}%<br>` +
                        `✓ Verified Payment: $${verifiedPayment.toFixed(2)}<br>` +
                        `✓ Difference: $${difference.toFixed(2)}`);
                } else {
                    showTestResult('manual-result', 'fail',
                        `✗ Rate: ${calculatedRate.toFixed(2)}%<br>` +
                        `✗ Expected Payment: $${payment.toFixed(2)}<br>` +
                        `✗ Actual Payment: $${verifiedPayment.toFixed(2)}<br>` +
                        `✗ Difference: $${difference.toFixed(2)}`);
                }
            }
        }

        function showTestResult(elementId, type, message) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `test-result ${type}`;
            element.innerHTML = message;
        }

        function clearResults() {
            document.getElementById('manual-result').style.display = 'none';
            document.getElementById('automated-results').innerHTML = '';
            document.getElementById('edge-case-results').innerHTML = '';
            document.getElementById('validation-results').innerHTML = '';
        }

        function runAutomatedTests() {
            testResults = { passed: 0, failed: 0, total: 0 };
            const results = [];

            // Test Case 1: Standard car loan scenario
            const test1 = testCalculation(25000, 60, 450);
            results.push(test1);

            // Test Case 2: High-end vehicle
            const test2 = testCalculation(50000, 72, 750);
            results.push(test2);

            // Test Case 3: Short term loan
            const test3 = testCalculation(15000, 36, 450);
            results.push(test3);

            // Test Case 4: Long term loan
            const test4 = testCalculation(30000, 84, 400);
            results.push(test4);

            // Test Case 5: Very low payment scenario
            const test5 = testCalculation(20000, 60, 350);
            results.push(test5);

            displayAutomatedResults(results);
        }

        function testCalculation(principal, termInMonths, targetPayment) {
            const calculatedRate = calculateInterestRate(principal, termInMonths, targetPayment);

            if (calculatedRate === null) {
                testResults.failed++;
                return {
                    passed: false,
                    description: `$${principal.toLocaleString()} over ${termInMonths} months, target payment $${targetPayment.toFixed(2)}`,
                    message: 'Calculation returned null'
                };
            }

            // Verify calculation
            const verifiedPayment = calculateMonthlyPayment(principal, termInMonths, calculatedRate * 100);
            const difference = Math.abs(verifiedPayment - targetPayment);

            testResults.total++;
            if (difference < 0.01) {
                testResults.passed++;
                return {
                    passed: true,
                    description: `$${principal.toLocaleString()} over ${termInMonths} months, target payment $${targetPayment.toFixed(2)}`,
                    message: `Rate: ${calculatedRate.toFixed(2)}%, Verified payment: $${verifiedPayment.toFixed(2)}`
                };
            } else {
                testResults.failed++;
                return {
                    passed: false,
                    description: `$${principal.toLocaleString()} over ${termInMonths} months, target payment $${targetPayment.toFixed(2)}`,
                    message: `Rate: ${calculatedRate.toFixed(2)}%, Expected: $${targetPayment.toFixed(2)}, Got: $${verifiedPayment.toFixed(2)}, Difference: $${difference.toFixed(2)}`
                };
            }
        }

        function displayAutomatedResults(results) {
            let html = `<h3>Test Results: ${testResults.passed}/${testResults.total} passed</h3>`;

            if (testResults.failed === 0) {
                html += '<div class="test-result pass">✓ All automated tests passed!</div>';
            } else {
                html += `<div class="test-result fail">✗ ${testResults.failed} test(s) failed</div>`;
            }

            html += '<div class="test-details">';
            results.forEach((result, index) => {
                const type = result.passed ? 'pass' : 'fail';
                html += `<div class="test-result ${type}">`;
                html += `<strong>Test ${index + 1}:</strong> ${result.description}<br>`;
                html += `<em>${result.message}</em>`;
                html += '</div>';
            });
            html += '</div>';

            document.getElementById('automated-results').innerHTML = html;
        }

        function runEdgeCaseTests() {
            const results = [];

            // Test Case 1: Zero interest scenario
            const minPayment = 25000 / 60; // $416.67
            const zeroRateTest = testEdgeCase(25000, 60, minPayment + 0.01, 'Near zero rate scenario');
            results.push(zeroRateTest);

            // Test Case 2: Very small payment (should fail)
            const tooSmallTest = testEdgeCase(25000, 60, 400, 'Payment too small (should fail)');
            results.push(tooSmallTest);

            // Test Case 3: Very large principal
            const largePrincipalTest = testEdgeCase(100000, 60, 2000, 'Large principal amount');
            results.push(largePrincipalTest);

            // Test Case 4: Very long term
            const longTermTest = testEdgeCase(25000, 120, 300, 'Very long term (10 years)');
            results.push(longTermTest);

            // Test Case 5: Very short term
            const shortTermTest = testEdgeCase(25000, 12, 2100, 'Very short term (1 year)');
            results.push(shortTermTest);

            displayEdgeCaseResults(results);
        }

        function testEdgeCase(principal, termInMonths, targetPayment, description) {
            const calculatedRate = calculateInterestRate(principal, termInMonths, targetPayment);

            // Check if payment is sufficient
            const minPayment = principal / termInMonths;
            const shouldFail = targetPayment < minPayment;

            if (shouldFail) {
                // This should fail, so null/undefined rate is expected
                return {
                    passed: calculatedRate === null,
                    description: description,
                    message: calculatedRate === null ?
                        '✓ Correctly identified payment too low' :
                        `✗ Should have failed but got rate: ${calculatedRate?.toFixed(2)}%`
                };
            } else {
                // This should succeed
                if (calculatedRate === null) {
                    return {
                        passed: false,
                        description: description,
                        message: '✗ Calculation failed when it should have succeeded'
                    };
                }

                // Verify calculation
                const verifiedPayment = calculateMonthlyPayment(principal, termInMonths, calculatedRate * 100);
                const difference = Math.abs(verifiedPayment - targetPayment);

                return {
                    passed: difference < 0.01,
                    description: description,
                    message: difference < 0.01 ?
                        `✓ Rate: ${calculatedRate.toFixed(2)}%, Verified correctly` :
                        `✗ Rate: ${calculatedRate.toFixed(2)}%, Verification failed (diff: $${difference.toFixed(2)})`
                };
            }
        }

        function displayEdgeCaseResults(results) {
            let html = '<h3>Edge Case Test Results</h3>';
            results.forEach((result, index) => {
                const type = result.passed ? 'pass' : 'fail';
                html += `<div class="test-result ${type}">`;
                html += `<strong>Test ${index + 1}:</strong> ${result.description}<br>`;
                html += `<em>${result.message}</em>`;
                html += '</div>';
            });
            document.getElementById('edge-case-results').innerHTML = html;
        }

        function runValidationTests() {
            const results = [];

            // Test Case 1: Invalid principal (negative)
            const test1 = testValidation(-1000, 60, 450, 'Negative principal should fail');
            results.push(test1);

            // Test Case 2: Zero principal
            const test2 = testValidation(0, 60, 450, 'Zero principal should fail');
            results.push(test2);

            // Test Case 3: Invalid term (zero)
            const test3 = testValidation(25000, 0, 450, 'Zero term should fail');
            results.push(test3);

            // Test Case 4: Invalid payment (negative)
            const test4 = testValidation(25000, 60, -100, 'Negative payment should fail');
            results.push(test4);

            // Test Case 5: Non-numeric values
            const test5 = testValidation(NaN, 60, 450, 'NaN principal should fail');
            results.push(test5);

            displayValidationResults(results);
        }

        function testValidation(principal, termInMonths, targetPayment, description) {
            // Simulate the validation logic from the form
            if (isNaN(principal) || isNaN(termInMonths) || isNaN(targetPayment) ||
                principal <= 0 || termInMonths <= 0 || targetPayment <= 0) {
                return {
                    passed: true,
                    description: description,
                    message: '✓ Validation correctly rejected invalid input'
                };
            } else {
                return {
                    passed: false,
                    description: description,
                    message: '✗ Validation should have rejected invalid input'
                };
            }
        }

        function displayValidationResults(results) {
            let html = '<h3>Input Validation Test Results</h3>';
            results.forEach((result, index) => {
                const type = result.passed ? 'pass' : 'fail';
                html += `<div class="test-result ${type}">`;
                html += `<strong>Test ${index + 1}:</strong> ${result.description}<br>`;
                html += `<em>${result.message}</em>`;
                html += '</div>';
            });
            document.getElementById('validation-results').innerHTML = html;
        }

        // Auto-run basic tests on page load
        window.addEventListener('load', function() {
            console.log('Interest Rate Solver test page loaded');
            console.log('Running basic smoke test...');

            // Basic smoke test
            const smokeTest = testCalculation(25000, 60, 450);
            if (smokeTest.passed) {
                console.log('✓ Basic functionality test passed');
            } else {
                console.log('✗ Basic functionality test failed:', smokeTest.message);
            }
        });
    </script>
</body>
</html>
